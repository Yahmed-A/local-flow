name: Android build

on:
  push:
    branches: [main]
    paths: ["android/**", "formatting.py", "arabic_phrases.py", ".github/workflows/android.yml"]
    tags: ["android-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null
      - name: Signing key (from repo secrets; without them the APK is debug-signed)
        env:
          KEYSTORE_B64: ${{ secrets.LF_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            echo "LF_KEYSTORE_FILE=$PWD/release.jks" >> $GITHUB_ENV
          fi
      - name: Unit tests (Kotlin text rules match the desktop Python output)
        run: ./gradlew testDebugUnitTest --console=plain
      - name: Build APK
        env:
          LF_KEYSTORE_PASSWORD: ${{ secrets.LF_KEYSTORE_PASSWORD }}
          LF_KEY_ALIAS: localflow
          LF_KEY_PASSWORD: ${{ secrets.LF_KEYSTORE_PASSWORD }}
          LF_VERSION_CODE: ${{ github.run_number }}
          LF_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: |
          ./gradlew assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk LocalFlow.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LocalFlow-android
          path: android/LocalFlow.apk
      - name: Publish release (android-v* tags only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} LocalFlow.apk --title "Local Flow for Android ${{ github.ref_name }}" --notes "Android: download LocalFlow.apk on the phone, open it and allow installing. Then open Local Flow and follow the five setup steps." --latest=false
